<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title and page.nav != 'home' %}<title>{{ page.title }} · {{ site.title }}</title>{% else %}<title>{{ site.title }}</title>{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ page.image | default: '/assets/img/keyart.webp' | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1e1d1d">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/darumadrop-one-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/londrina-solid-900-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/urbanist-800-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<style>html{background:#f7f3ed}html.wipe-in{background:#558eff}html.wipe-in .site-main,html.wipe-in .site-footer{opacity:0}</style>
<script>(function(){try{if(sessionStorage.getItem('bv-wipe')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('wipe-in');}}catch(e){}})();</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.splash %}<script>(function(){try{if(!sessionStorage.getItem('bv-splash')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('splash-pending');}}catch(e){}})();</script>{% endif %}
