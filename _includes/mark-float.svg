<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mark" role="img" aria-label="blue, the studio mark" viewBox="119 123.5 134 134" width="536" height="536" preserveAspectRatio="xMidYMid meet">
<style>
  .fl {
    transform-box: fill-box;
    transform-origin: center;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  @keyframes float-b {
    0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    35%      { transform: translate(-1.8px, -3.25px) rotate(-4deg); }
    70%      { transform: translate(1.45px, -1.45px) rotate(0deg); }
  }
  @keyframes float-l {
    0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    50%      { transform: translate(2.15px, -3.95px) rotate(6deg); }
  }
  @keyframes float-u {
    0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    40%      { transform: translate(-2.15px, 2.9px) rotate(-7deg); }
    75%      { transform: translate(1.8px, 1.8px) rotate(-12deg); }
  }
  @keyframes float-e {
    0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    45%      { transform: translate(2.5px, -2.5px) rotate(8deg); }
  }
  @keyframes float-dot {
    0%, 100% { transform: translate(0px, 0px); }
    50%      { transform: translate(-1.45px, 2.15px); }
  }
  .f-b   { animation: float-b   5.2s ease-in-out infinite; }
  .f-l   { animation: float-l   6.1s ease-in-out infinite 0.4s; }
  .f-u   { animation: float-u   4.8s ease-in-out infinite 1.1s; }
  .f-e   { animation: float-e   5.5s ease-in-out infinite 0.7s; }
  .f-dot { animation: float-dot 7s   ease-in-out infinite 0.3s; }
</style>
