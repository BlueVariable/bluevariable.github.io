title: Blue Variable Studio
tagline: Two-person independent indie game studio. Games we'd love to play, crafted into existence.
description: Blue Variable Studio is an independent indie game studio based in Ankara, Turkey, currently working on its debut game Purrfect Fit.
url: "https://bluevariablestudio.com"
baseurl: ""
lang: en
email: info@bluevariablestudio.com
author:
  name: Blue Variable Studio
social_image: /assets/img/brand/social.jpg

links:
  steam: https://store.steampowered.com/developer/bluevariablestudio
  discord: https://discord.gg/bluevariablestudio
  itch: https://bluevariablestudio.itch.io
  x: https://x.com/bluevariablestudio
  instagram: https://instagram.com/bluevariablestudio
  youtube: https://youtube.com/@bluevariablestudio
  reddit: https://reddit.com/r/bluevariablestudio
wishlist_url: https://store.steampowered.com/developer/bluevariablestudio
presskit_url: /assets/presskit/blue-variable-presskit.zip

plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
permalink: /news/:year/:month/:day/:title/
future: true

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, game: Purrfect Fit }

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
